baseURL = "https://zx539.github.io/MyBlog/"
languageCode = "zh-CN"
title = "张迅 | AI Agent 开发者"

[params]
  description = "张迅的个人博客与作品集，记录 AI Agent、系统软件、编程语言与校园项目实践。"
  author = "张迅"
  github = "https://github.com/zx539"
  email = "202412724@stu.neuq.edu.cn"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "github-dark"
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS"]
