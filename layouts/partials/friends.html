{{ $friends := site.Data.friends }}
{{ if $friends }}
<section class="section editorial-section friends-section">
  <header class="chapter-heading">
    <span>05</span>
    <div>
      <p class="eyebrow">友人帳 · Links</p>
      <h2>友情链接</h2>
    </div>
  </header>
  <div class="friends-grid">
    {{ range $index, $friend := $friends }}
      <a class="friend-card" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
        <span class="friend-card__index">{{ printf "%02d" (add $index 1) }}</span>
        {{ with .avatar }}
          <img class="friend-card__avatar" src="{{ . | relURL }}" alt="{{ $friend.name }}的头像" width="56" height="56" loading="lazy" decoding="async">
        {{ else }}
          <span class="friend-card__avatar friend-card__avatar--fallback" aria-hidden="true">{{ substr $friend.name 0 1 }}</span>
        {{ end }}
        <span class="friend-card__tag">{{ .tag }}</span>
        <strong>{{ .name }}</strong>
        <p>{{ .description }}</p>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
