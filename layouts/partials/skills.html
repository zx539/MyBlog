{{ $profile := site.Data.profile }}
<section class="section editorial-section skills-section">
  <header class="chapter-heading">
    <span>02</span>
    <div>
      <p class="eyebrow">得意分野 · Skills</p>
      <h2>技能与工具箱</h2>
    </div>
  </header>
  <div class="skill-cloud">
    {{ range $index, $skill := $profile.skills }}
      <span><small>{{ printf "%02d" (add $index 1) }}</small>{{ $skill }}</span>
    {{ end }}
  </div>
</section>
